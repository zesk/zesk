options:
  docker: true

definitions:
  caches:
    apt-lists: /var/lib/apt/lists
    apt-cache: /var/cache/apt
  services:
    mariadb:
      memory: 1024
      image: mariadb:latest

image: atlassian/default-image:4
pipelines:
  branches:
    main:
      - step:
          deployment: production
          name: Build and test
          services:
            - mariadb
          artifacts:
            - .build.env
            - .release-notes.md
            - test-coverage/
            - test.log
          caches:
            - docker
            - apt-lists
            - apt-cache
          size: 2x
          script:
            - DATABASE_ROOT_PASSWORD=$MARIADB_ROOT_PASSWORD CONTAINER_DATABASE_HOST=localhost bin/build.sh --testsuite core
      - step:
          name: Deploy
          trigger: manual
          script:
            - bin/deploy.sh
    staging:
      - step:
          deployment: staging
          name: Build and test
          services:
            - mariadb
          artifacts:
            - .build.env
            - .release-notes.md
            - test-coverage/
            - test.log
          caches:
            - docker
            - apt-lists
            - apt-cache
          script:
            - DATABASE_ROOT_PASSWORD=$MARIADB_ROOT_PASSWORD CONTAINER_DATABASE_HOST=localhost bin/build.sh --staging --testsuite core
    deploy:
      - step:
          deployment: deploy
          name: Deploy Testing
          script:
            - bin/deploy.sh
