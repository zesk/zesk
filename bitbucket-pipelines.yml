#
# https://community.atlassian.com/forums/Bitbucket-questions/Can-t-access-MySQL-On-BitBucket-Cloud/qaq-p/1595905
#
options:
  docker: true

definitions:
  caches:
    apt-lists: /var/lib/apt/lists
    apt-cache: /var/cache/apt
    docker-cache: /opt/atlassian/pipelines/agent/build/.docker/
  services:
    mariadb:
      memory: 1024
      image: mariadb:latest
      variables:
        MARIADB_ROOT_PASSWORD: $MARIADB_ROOT_PASSWORD

image: atlassian/default-image:4
pipelines:
  branches:
    main:
      - step:
          deployment: production
          name: Build and test
          services:
            - mariadb
          artifacts:
            - .build.env
            - .release-notes.md
            - phpunit-testcase-last.json
            - test-results/
            - test-coverage/
            - test.log
          caches:
            - docker
            - apt-lists
            - apt-cache
          size: 2x
          script:
            - CONTAINER_DATABASE_HOST=$BITBUCKET_DOCKER_HOST_INTERNAL bin/build.sh
      - step:
          name: Deploy
          trigger: manual
          script:
            - bin/deploy.sh
    staging:
      - step:
          deployment: staging
          name: Build and test
          services:
            - mariadb
          artifacts:
            - .build.env
            - .release-notes.md
            - phpunit-testcase-last.json
            - test-results/
            - test-coverage/
            - test.log
          caches:
            - docker-cache
            - docker
          size: 2x
          script:
            - CONTAINER_DATABASE_HOST=$BITBUCKET_DOCKER_HOST_INTERNAL bin/build.sh --staging
    deploy:
      - step:
          deployment: deploy
          name: Deploy Testing
          script:
            - bin/deploy.sh
